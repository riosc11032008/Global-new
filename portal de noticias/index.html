<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalNews - Tu Portal de Noticias</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado y Navegación -->
    <header class="site-header">
        <div class="logo">
            <h1>Global<span>News</span></h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="#" class="nav-link active" data-page="inicio.html">Inicio</a></li>
                <li><a href="#" class="nav-link" data-page="nacionales.html">Nacionales</a></li>
                <li><a href="#" class="nav-link" data-page="cultura.html">Cultura</a></li>
                <li><a href="#" class="nav-link" data-page="deportes.html">Deportes</a></li>
                <li><a href="#" class="nav-link" data-page="espectaculo.html">Espectáculo</a></li>
                <li><a href="#" class="nav-link" data-page="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Dinámico -->
    <main id="content-container">
        <!-- El contenido de las secciones se cargará aquí automáticamente -->
    </main>

    <!-- Pie de Página -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 GlobalNews. Todos los derechos reservados.</p>
            <p>Portal informativo de actualización constante.</p>
        </div>
    </footer>

    <!-- Script para carga dinámica sin iframe -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("content-container");
            const links = document.querySelectorAll(".nav-link");

            // Función para cargar páginas
            const loadPage = async (pageUrl) => {
                try {
                    const response = await fetch(pageUrl);
                    if (!response.ok) throw new Error("Error al cargar la sección");
                    const html = await response.text();
                    container.innerHTML = html;
                    
                    // Inicializar el slider si se carga el inicio
                    if(pageUrl === 'inicio.html') {
                        initSlider();
                    }
                } catch (error) {
                    container.innerHTML = `<p class="error-msg">Lo sentimos, no se pudo cargar el contenido. (${error.message})</p>`;
                }
            };

            // Evento para los enlaces del menú
            links.forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    links.forEach(l => l.classList.remove("active"));
                    link.classList.add("active");
                    
                    const page = link.getAttribute("data-page");
                    loadPage(page);
                });
            });

            // Carga inicial (Inicio)
            loadPage("inicio.html");
        });

        // Lógica básica del slider para inicio.html
        function initSlider() {
            const slides = document.querySelectorAll('.slide');
            if(slides.length === 0) return;
            let currentSlide = 0;

            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 4000);
        }
    </script>
</body>
</html>
