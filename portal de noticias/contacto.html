<h2 class="section-title">Contacto</h2>
<p style="margin-bottom: 1.5rem;">¿Tienes alguna denuncia informativa o quieres publicitar con nosotros? Escríbenos.</p>

<form class="contact-form" onsubmit="event.preventDefault(); alert('Mensaje enviado con éxito');">
    <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" required placeholder="Ingresa tu nombre">
    </div>
    <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
    </div>
    <div class="form-group">
        <label for="message">Mensaje / Detalle de la noticia</label>
        <textarea id="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
    </div>
    <button type="submit" class="submit-btn">Enviar Mensaje</button>
</form>
